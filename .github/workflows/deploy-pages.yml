name: GitHub Pagesへ公開

# main ブランチへの push、新着情報の取得ワークフロー完了後、または手動実行で
# サイトをビルドして GitHub Pages に公開します。
on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - 新着情報を自動取得
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}

      - name: Node.js を準備
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 公開パスを判定
        id: basepath
        run: |
          if [[ "${GITHUB_REPOSITORY#*/}" == *.github.io ]]; then
            echo "value=/" >> "$GITHUB_OUTPUT"
          else
            echo "value=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_OUTPUT"
          fi

      - name: 依存関係をインストール
        run: npm ci --no-audit --no-fund

      - name: noteの新着記事を取得
        run: node scripts/fetch-note-rss.mjs

      - name: サイトをビルド
        env:
          BASE_PATH: ${{ steps.basepath.outputs.value }}
        run: npm run build

      - name: サブページと404ページを用意
        run: |
          for page in farm schedule photo business about voices contact; do
            mkdir -p "out/$page"
            cp out/index.html "out/$page/index.html"
          done
          cp out/index.html out/404.html
          touch out/.nojekyll

      - name: Pages を設定
        uses: actions/configure-pages@v5

      - name: ビルド結果をアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages へデプロイ
        id: deployment
        uses: actions/deploy-pages@v4